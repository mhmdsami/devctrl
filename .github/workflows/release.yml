name: Release Raycast Extension

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (changelog for this version)"
        required: false
        default: "Bug fixes and improvements"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read and check version
        run: |
          VERSION=$(node -p "require('./raycast/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists - bump raycast/package.json first"
            exit 1
          fi
          echo "releasing v$VERSION"
      - uses: raycast/github-actions/setup-cli@v1.18.0
        with:
          version: 1.104.6
      - uses: raycast/github-actions/ray-cli@v1.18.0
        with:
          paths: raycast
          command: publish
          access_token: ${{ secrets.RAYCAST_ORGANIZATION_TOKEN }}
      - name: Tag
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes "${{ inputs.notes }}" --verify-tag
